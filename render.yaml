services:
  - type: web
    name: abd-mission-control-api
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: apps/api/Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: API_CORS_ORIGIN
        sync: false
      - key: AUTH_OWNER_EMAIL
        sync: false
      - key: AUTH_OWNER_PASSWORD
        sync: false
      - key: AUTH_SESSION_SECRET
        sync: false
      - key: COLLECTOR_API_TOKEN
        sync: false
      - key: COLLECTOR_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: abd-mission-control-db
          property: connectionString

databases:
  - name: abd-mission-control-db
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: '17'
    databaseName: mission_control
    user: mission_control
    ipAllowList: []
